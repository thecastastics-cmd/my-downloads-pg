<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castastics Open World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        /* Mobile Touch Controls */
        .controls-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            z-index: 10;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div id="ui">Use the on-screen buttons to explore!</div>

    <!-- Mobile D-Pad Controls -->
    <div class="controls-container">
        <button class="control-btn" id="btn-up">▲</button>
        <button class="control-btn" id="btn-left">◀</button>
        <button class="control-btn" id="btn-down">▼</button>
        <button class="control-btn" id="btn-right">▶</button>
    </div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. SETUP SCENE, CAMERA, & RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Bright friendly sky blue
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 3. COLORFUL WORLD & BUILDINGS
        // Vibrant Ground
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Colorful Buildings / Obstacles
        const colors = [0xff5722, 0x3f51b5, 0x9c27b0, 0x00bcd4, 0xffeb3b, 0xe91e63];
        for (let i = 0; i < 35; i++) {
            const width = Math.random() * 5 + 3;
            const height = Math.random() * 15 + 5;
            const depth = Math.random() * 5 + 3;
            
            const boxGeo = new THREE.BoxGeometry(width, height, depth);
            const boxMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.4 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            
            box.position.x = (Math.random() - 0.5) * 180;
            box.position.z = (Math.random() - 0.5) * 180;
            box.position.y = height / 2;
            
            // Keep center clear
            if (Math.abs(box.position.x) < 15 && Math.abs(box.position.z) < 15) {
                box.position.x += 20;
            }

            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
        }

        // 4. LOAD CHARACTER SPRITE
        const textureLoader = new THREE.TextureLoader();
        const charTexture = textureLoader.load('character.png');
        charTexture.encoding = THREE.sRGBEncoding;

        const spriteMat = new THREE.SpriteMaterial({ map: charTexture, transparent: true });
        const player = new THREE.Sprite(spriteMat);
        player.scale.set(3.5, 4.5, 1);
        player.position.set(0, 2.2, 0);
        scene.add(player);

        // 5. TOUCH & KEYBOARD CONTROLS (Works on Mobile and PC)
        const moveState = { forward: false, backward: false, left: false, right: false };

        function bindButton(id, stateKey) {
            const btn = document.getElementById(id);
            ['touchstart', 'mousedown'].forEach(evt => btn.addEventListener(evt, (e) => { e.preventDefault(); moveState[stateKey] = true; }));
            ['touchend', 'mouseup', 'mouseleave'].forEach(evt => btn.addEventListener(evt, (e) => { e.preventDefault(); moveState[stateKey] = false; }));
        }

        bindButton('btn-up', 'forward');
        bindButton('btn-down', 'backward');
        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');

        // Also support keyboard for testing on PC if needed
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') moveState.forward = true;
            if (e.key === 's' || e.key === 'ArrowDown') moveState.backward = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') moveState.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') moveState.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') moveState.forward = false;
            if (e.key === 's' || e.key === 'ArrowDown') moveState.backward = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') moveState.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') moveState.right = false;
        });

        // 6. ANIMATION LOOP
        const speed = 0.18;

        function animate() {
            requestAnimationFrame(animate);

            // Movement logic
            if (moveState.forward)  player.position.z -= speed;
            if (moveState.backward) player.position.z += speed;
            if (moveState.left)     player.position.x -= speed;
            if (moveState.right)    player.position.x += speed;

            // Smooth camera follow
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 3.5;
            camera.position.z = player.position.z + 9;
            camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Screen resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
